name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm check

      - name: Build
        run: pnpm build

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile

      - name: Verify manifest checksums
        run: pnpm data:fetch

      - name: Verify index lineage sidecars
        run: pnpm verify:index-lineage

      - name: Validate data (json + parquet)
        run: uv sync --frozen && pnpm validate:data

      - name: Run @ejam/data tests
        run: pnpm --filter @ejam/data test
