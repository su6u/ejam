# Manual production deploy — use after CI is green or to recover from a failed auto deploy.
# Automatic prod deploys run in ci.yml after relevant app/data checks pass on main.

name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234 or latest). Leave blank to build fresh from HEAD.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/ejam-web
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # If a specific image_tag was provided, skip the build and promote that
      # existing image to the tag Dokploy pulls.
      - name: Resolve deploy target
        id: target
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Building skipped — deploying existing tag: ${{ inputs.image_tag }}"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image metadata
        if: steps.target.outputs.skip_build == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.target.outputs.skip_build == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote existing image for rollback
        if: steps.target.outputs.skip_build == 'true' && steps.target.outputs.tag != 'latest'
        run: |
          TARGET_IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.target.outputs.tag }}"
          LATEST_IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"

          echo "Validating rollback image: ${TARGET_IMAGE}"
          docker buildx imagetools inspect "${TARGET_IMAGE}" > /dev/null

          echo "Promoting ${TARGET_IMAGE} to ${LATEST_IMAGE} for Dokploy"
          docker buildx imagetools create --tag "${LATEST_IMAGE}" "${TARGET_IMAGE}"

      - name: Trigger Dokploy redeploy
        run: |
          echo "Triggering Dokploy webhook..."
          STATUS=$(curl -sS -o /tmp/dokploy-response.json -w "%{http_code}" \
            -X GET \
            "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          echo "Dokploy response (HTTP $STATUS):"
          cat /tmp/dokploy-response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Webhook call failed with status $STATUS"
            exit 1
          fi

      - name: Verify deployment health
        timeout-minutes: 6
        run: bash .github/scripts/dokploy-healthcheck.sh
        env:
          HEALTH_URL: https://ejam.in/
