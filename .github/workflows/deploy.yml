# Manual production deploy — use after CI is green or to recover from a failed auto deploy.
# Automatic prod deploys run in ci.yml after relevant app/data checks pass on main.

name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234 or latest). Leave blank to build fresh from HEAD.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/ejam-web
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # If a specific image_tag was provided, skip the build and just re-deploy
      # the existing image — useful for instant rollbacks or hotfix re-deploys.
      - name: Resolve deploy target
        id: target
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            if [[ "$REQUESTED_IMAGE_TAG" != "latest" && ! "$REQUESTED_IMAGE_TAG" =~ ^sha-[0-9a-fA-F]+$ ]]; then
              echo "Unsupported image_tag: $REQUESTED_IMAGE_TAG"
              echo "Use 'latest' or an immutable sha-* tag produced by CI."
              exit 1
            fi
            echo "Building skipped — deploying existing tag: $REQUESTED_IMAGE_TAG"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image metadata
        if: steps.target.outputs.skip_build == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.target.outputs.skip_build == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote existing image for Dokploy
        if: steps.target.outputs.skip_build == 'true'
        env:
          SOURCE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          SOURCE_IMAGE="${IMAGE}:${SOURCE_TAG}"
          TARGET_IMAGE="${IMAGE}:latest"

          echo "Verifying source image exists: ${SOURCE_IMAGE}"
          docker buildx imagetools inspect "$SOURCE_IMAGE" >/dev/null

          if [ "$SOURCE_TAG" = "latest" ]; then
            echo "Source image is already latest; no promotion needed."
            exit 0
          fi

          echo "Promoting ${SOURCE_IMAGE} to ${TARGET_IMAGE} for Dokploy"
          docker buildx imagetools create -t "$TARGET_IMAGE" "$SOURCE_IMAGE"

      - name: Trigger Dokploy redeploy
        run: |
          echo "Triggering Dokploy webhook..."
          STATUS=$(curl -sS -o /tmp/dokploy-response.json -w "%{http_code}" \
            -X GET \
            "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          echo "Dokploy response (HTTP $STATUS):"
          cat /tmp/dokploy-response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Webhook call failed with status $STATUS"
            exit 1
          fi

      - name: Verify deployment health
        timeout-minutes: 6
        run: bash .github/scripts/dokploy-healthcheck.sh
        env:
          HEALTH_URL: https://ejam.in/
