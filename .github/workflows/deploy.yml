name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify data checksums
        run: pnpm data:fetch

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. Create a token at https://vercel.com/account/tokens then: gh secret set VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID must be set (from apps/web/.vercel/project.json after vercel link)"
            exit 1
          fi
          pnpm dlx vercel@latest whoami || {
            echo "::error::VERCEL_TOKEN is invalid or expired. Regenerate at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN"
            exit 1
          }

      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production

      - name: Build for Vercel
        run: pnpm dlx vercel@latest build --prod

      - name: Deploy to production
        run: pnpm dlx vercel@latest deploy --prebuilt --prod
