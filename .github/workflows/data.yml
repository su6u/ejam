name: Data pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify manifest checksums
        run: pnpm data:fetch

      - name: Verify index lineage sidecars
        run: pnpm verify:index-lineage

      - name: Validate JEE JSON schemas
        run: pnpm validate:data

      - name: Run @ejam/data tests
        run: pnpm --filter @ejam/data test
