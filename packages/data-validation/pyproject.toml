[project]
name = "ejam-data-validation"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "pydantic>=2.0"]

[project.scripts]
validate-data = "ejam_data_validation.validate_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ejam_data_validation"]
